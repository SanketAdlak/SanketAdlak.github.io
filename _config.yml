### Site Settings ###
title               : Sanket Adlak
description         : >-  
                        <h5> MTech @ IIIT-H | Ex-Software Engineer | Product Engineering </h5><br>
                        I build user-centric digital products :thinking: and scalable systems. :man_technologist:


                        
                  
baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : SanketAdlak/SanketAdlak.github.io      # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
remote_theme        : yousinix/portfolYOU
open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-pdf-embed


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - documentation/partials/**                           # For Documentation Only


